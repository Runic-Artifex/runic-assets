name: Check out verification dependencies
description: Checks out the exact Runic 1.0 preview source candidates used by package verification.

runs:
  using: composite
  steps:
    - name: Check out exact Runic Command Line candidate
      uses: actions/checkout@v7
      with:
        repository: Runic-Artifex/runic-command-line
        ref: beadc31d91746a2cb005207ac1161cf579e128e5
        path: .runic-dependencies/runic-command-line
        fetch-depth: 1

    - name: Check out exact Runic Desktop candidate
      uses: actions/checkout@v7
      with:
        repository: Runic-Artifex/runic-desktop
        ref: a0d1432e9a7b8dcf3d6311fcbdf4e824bc0d479f
        path: .runic-dependencies/runic-desktop
        fetch-depth: 1

    - name: Verify candidate revisions
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C .runic-dependencies/runic-command-line rev-parse HEAD)" = "beadc31d91746a2cb005207ac1161cf579e128e5"
        test "$(git -C .runic-dependencies/runic-desktop rev-parse HEAD)" = "a0d1432e9a7b8dcf3d6311fcbdf4e824bc0d479f"
